<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Frotz</title>
  <style>
    /* Page colours, and the Z-machine colour table (2 black, 3 red,
       4 green, 5 yellow, 6 blue, 7 magenta, 8 cyan, 9 white, 10-12 greys)
       tuned for each scheme. Colour 1 ("default") is --fg / --screen-bg. */
    :root {
      color-scheme: light dark;
      --bg: #fbfaf7;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --rule: #d9d6cf;
      --screen-bg: var(--bg);
      --z2: #1d1d1f;
      --z3: #c62828;
      --z4: #2e7d32;
      --z5: #a77b00;
      --z6: #1f57c3;
      --z7: #a0309a;
      --z8: #00838f;
      --z9: #ffffff;
      --z10: #c7c7cc;
      --z11: #8e8e93;
      --z12: #48484a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161617;
        --fg: #e8e6e1;
        --muted: #98989d;
        --rule: #3a3a3c;
        --z2: #000000;
        --z3: #ff6b63;
        --z4: #5fcf6a;
        --z5: #ffd54a;
        --z6: #6aa5ff;
        --z7: #e27ddb;
        --z8: #4fd3dc;
        --z9: #f5f5f7;
        --z10: #aeaeb2;
        --z11: #7c7c80;
        --z12: #3a3a3c;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--screen-bg);
      color: var(--fg);
      font: 17px/1.5 Georgia, "Iowan Old Style", serif;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-bottom: 1px solid var(--rule);
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
    }
    button, .file-button {
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .file-button input { display: none; }
    dialog {
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 10px;
      max-width: min(32rem, calc(100vw - 32px));
      width: 100%;
      font: 15px/1.5 -apple-system, system-ui, sans-serif;
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.35); }
    dialog h2 { font-size: 17px; margin: 0 0 8px; }
    #saves-list { list-style: none; margin: 0 0 12px; padding: 0; }
    #saves-list li {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule);
    }
    #saves-list li.empty { color: var(--muted); }
    .dialog-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    #story-title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body[data-mode="picker"] #stories-button,
    body[data-mode="picker"] #saves-button { visibility: hidden; }
    body[data-mode="picker"] #status,
    body[data-mode="picker"] #transcript,
    body[data-mode="picker"] #command-form { display: none; }
    #picker {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      max-width: 48rem;
      width: 100%;
      align-self: center;
    }
    #picker h1 { font-size: 22px; margin: 8px 0 12px; }
    #story-list { list-style: none; margin: 0 0 16px; padding: 0; }
    #story-list a {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule);
      color: inherit;
      text-decoration: none;
    }
    #story-list a:hover .story-name { text-decoration: underline; }
    .story-author { color: var(--muted); font-size: 15px; }
    #status {
      margin: 0 auto;
      padding: 0;
      font: var(--grid-font, 15px)/1.25 ui-monospace, Menlo, monospace;
      white-space: pre;
      overflow: hidden;
      width: calc(var(--cols, 80) * 1ch);
      max-width: 100%;
      flex: none;
    }
    .grid-row { height: 1.25em; }
    .grid-probe {
      position: absolute;
      visibility: hidden;
      white-space: pre;
      font-family: ui-monospace, Menlo, monospace;
    }
    #transcript {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      max-width: 48rem;
      width: 100%;
      align-self: center;
    }
    .s-bold { font-weight: bold; }
    .s-emphasis { font-style: italic; }
    .s-fixed { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
    /* .s-reverse colours are set inline from the attribute (app.js). */
    #command-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--rule);
      max-width: 48rem;
      width: 100%;
      align-self: center;
    }
    #command {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
    }
  </style>
</head>
<body data-mode="picker">
  <div id="toolbar">
    <button id="stories-button" type="button">Stories</button>
    <span id="story-title">Web Frotz</span>
    <button id="saves-button" type="button">Saves</button>
  </div>
  <section id="picker" hidden>
    <h1>Choose a story</h1>
    <ul id="story-list"></ul>
    <label class="file-button">Open a story file…
      <input id="open-story" type="file"
             accept=".z3,.z4,.z5,.z7,.z8,.zblorb,.zlb,.z6">
    </label>
    <p class="note">Your own Z-code files (.z3–.z8, .zblorb) stay on this device;
      nothing is uploaded. V6 graphics games are not supported.</p>
  </section>
  <div id="status" role="status" hidden></div>
  <div id="transcript" aria-live="polite"></div>
  <form id="command-form" autocomplete="off">
    <input id="command" type="text" autocapitalize="off" autocorrect="off"
           spellcheck="false" enterkeyhint="send" aria-label="Command">
  </form>
  <dialog id="saves-dialog">
    <form method="dialog">
      <h2>Saves</h2>
      <ul id="saves-list"></ul>
      <div class="dialog-actions">
        <label class="file-button">Import save…
          <input id="import-save" type="file" accept=".sav,.qzl,application/octet-stream">
        </label>
        <button value="close">Done</button>
      </div>
      <p id="import-note" class="note"></p>
      <p class="note">Saves are kept in this browser's storage. Safari may delete
        them after 7 days without a visit, so export the ones you care about.</p>
    </form>
  </dialog>
  <script src="dist/frotz.js"></script>
  <script src="app.js"></script>
</body>
</html>
