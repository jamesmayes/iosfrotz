<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Frotz</title>
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --rule: #d9d6cf;
      --status-bg: #1d1d1f;
      --status-fg: #fbfaf7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161617;
        --fg: #e8e6e1;
        --muted: #98989d;
        --rule: #3a3a3c;
        --status-bg: #e8e6e1;
        --status-fg: #161617;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 Georgia, "Iowan Old Style", serif;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px 16px;
      border-bottom: 1px solid var(--rule);
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
    }
    button, .file-button {
      font: 14px/1.4 -apple-system, system-ui, sans-serif;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .file-button input { display: none; }
    dialog {
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 10px;
      max-width: min(32rem, calc(100vw - 32px));
      width: 100%;
      font: 15px/1.5 -apple-system, system-ui, sans-serif;
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.35); }
    dialog h2 { font-size: 17px; margin: 0 0 8px; }
    #saves-list { list-style: none; margin: 0 0 12px; padding: 0; }
    #saves-list li {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule);
    }
    #saves-list li.empty { color: var(--muted); }
    .dialog-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    #status {
      margin: 0;
      padding: 4px 16px;
      background: var(--status-bg);
      color: var(--status-fg);
      font: 14px/1.4 ui-monospace, Menlo, monospace;
      white-space: pre;
      overflow: hidden;
    }
    #transcript {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      max-width: 46rem;
      width: 100%;
      align-self: center;
    }
    .s-bold { font-weight: bold; }
    .s-emphasis { font-style: italic; }
    .s-fixed { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
    .s-reverse { background: var(--fg); color: var(--bg); }
    #command-form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--rule);
      max-width: 46rem;
      width: 100%;
      align-self: center;
    }
    #command {
      flex: 1;
      min-width: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="saves-button" type="button">Saves</button>
  </div>
  <pre id="status" hidden></pre>
  <div id="transcript" aria-live="polite"></div>
  <form id="command-form" autocomplete="off">
    <input id="command" type="text" autocapitalize="off" autocorrect="off"
           spellcheck="false" enterkeyhint="send" aria-label="Command">
  </form>
  <dialog id="saves-dialog">
    <form method="dialog">
      <h2>Saves</h2>
      <ul id="saves-list"></ul>
      <div class="dialog-actions">
        <label class="file-button">Import save…
          <input id="import-save" type="file" accept=".sav,.qzl,application/octet-stream">
        </label>
        <button value="close">Done</button>
      </div>
      <p id="import-note" class="note"></p>
      <p class="note">Saves are kept in this browser's storage. Safari may delete
        them after 7 days without a visit, so export the ones you care about.</p>
    </form>
  </dialog>
  <script src="dist/frotz.js"></script>
  <script src="app.js"></script>
</body>
</html>
